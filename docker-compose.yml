services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meter-billing-app:latest
    container_name: meter_billing_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-meter_billing}
      - DB_USERNAME=${DB_USERNAME:-meter_user}
      - DB_PASSWORD=${DB_PASSWORD:-meter_secret_pass}
    networks:
      - meter_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: meter_billing_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - meter_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: meter_billing_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-meter_billing}
      MYSQL_USER: ${DB_USERNAME:-meter_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meter_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - meter_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue:
    image: meter-billing-app:latest
    container_name: meter_billing_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-meter_billing}
      - DB_USERNAME=${DB_USERNAME:-meter_user}
      - DB_PASSWORD=${DB_PASSWORD:-meter_secret_pass}
    networks:
      - meter_network
    depends_on:
      - app
      - db

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local

networks:
  meter_network:
    driver: bridge
