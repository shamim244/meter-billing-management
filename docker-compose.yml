services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meter-billing-app:latest
    container_name: meter_billing_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - app_build:/var/www/public/build
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-meter_billing}
      - DB_USERNAME=${DB_USERNAME:-meter_user}
      - DB_PASSWORD=${DB_PASSWORD:-meter_secret_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=${CACHE_STORE:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    networks:
      - meter_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: meter_billing_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www:ro
      - app_build:/var/www/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - meter_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: meter_billing_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-meter_billing}
      MYSQL_USER: ${DB_USERNAME:-meter_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meter_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - meter_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: meter_billing_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - meter_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: meter-billing-app:latest
    container_name: meter_billing_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - RUN_MIGRATIONS=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-meter_billing}
      - DB_USERNAME=${DB_USERNAME:-meter_user}
      - DB_PASSWORD=${DB_PASSWORD:-meter_secret_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=${CACHE_STORE:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    networks:
      - meter_network
    depends_on:
      - app
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: meter-billing-app:latest
    container_name: meter_billing_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - RUN_MIGRATIONS=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-meter_billing}
      - DB_USERNAME=${DB_USERNAME:-meter_user}
      - DB_PASSWORD=${DB_PASSWORD:-meter_secret_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - meter_network
    depends_on:
      - app
      - db
      - redis

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_build:
    driver: local

networks:
  meter_network:
    driver: bridge
